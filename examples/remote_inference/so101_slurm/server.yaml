# SO-101: five body-joint angles in degrees and gripper opening in percent.
# Override model.repo_or_path with the checkpoint path on the Slurm compute node.
deployment: so101-bluecube
model:
  repo_or_path: /absolute/path/to/pi05/checkpoints/last/pretrained_model
  device: cuda
execution:
  supported_modes: [chunk]
  action_fps: 30.0
  n_action_steps: 50
  warmup_calls: 2
  action_deadline_s: 5.0
  idle_timeout_s: 10.0
zenoh:
  mode: peer
  listen_endpoints: [tcp/127.0.0.1:7447]
semantics: so101-degrees-gripper-percent-v1
robot_type: so101_follower
features:
  - name: observation.state
    shape: [6]
    dtype: float32
    names: [shoulder_pan.pos, shoulder_lift.pos, elbow_flex.pos, wrist_flex.pos, wrist_roll.pos, gripper.pos]
    semantics: so101-degrees-gripper-percent-v1
  - name: observation.images.front
    shape: [480, 640, 3]
    dtype: uint8
    kind: rgb
    semantics: rgb-front-table-v1
action_feature:
  name: action
  shape: [6]
  dtype: float32
  names: [shoulder_pan.pos, shoulder_lift.pos, elbow_flex.pos, wrist_flex.pos, wrist_roll.pos, gripper.pos]
  semantics: so101-degrees-gripper-percent-v1
